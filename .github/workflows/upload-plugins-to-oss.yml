name: Upload plugins to Aliyun OSS

on:
  push:
    branches:
      - main
    paths:
      - 'plugins/**/*.zip'
  workflow_dispatch:

concurrency:
  group: upload-plugins-oss
  cancel-in-progress: true

env:
  OSSUTIL_VERSION: 2.1.2
  # All OSS coordinates come from repository variables
  # (Settings > Secrets and variables > Actions > Variables).
  # Deliberately no defaults: nothing about the target bucket lives in this repo.
  OSS_BUCKET: ${{ vars.OSS_BUCKET }}
  OSS_PREFIX: ${{ vars.OSS_PREFIX }}
  # ossutil v2 reads these directly; sign version v4 requires the region.
  OSS_ENDPOINT: ${{ vars.OSS_ENDPOINT }}
  OSS_REGION: ${{ vars.OSS_REGION }}

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check configuration
        run: |
          set -euo pipefail
          missing=()
          for v in OSS_BUCKET OSS_PREFIX OSS_ENDPOINT OSS_REGION; do
            [ -n "${!v:-}" ] || missing+=("$v (variable)")
          done
          [ -n "${AK_ID}" ] || missing+=("OSS_ACCESS_KEY_ID (secret)")
          [ -n "${AK_SECRET}" ] || missing+=("OSS_ACCESS_KEY_SECRET (secret)")
          if [ ${#missing[@]} -gt 0 ]; then
            printf '::error::Not configured: %s\n' "$(IFS=', '; echo "${missing[*]}")"
            exit 1
          fi
        env:
          AK_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          AK_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}

      - name: Install ossutil
        run: |
          set -euo pipefail
          pkg="ossutil-${OSSUTIL_VERSION}-linux-amd64"
          curl -fsSL -o ossutil.zip \
            "https://gosspublic.alicdn.com/ossutil/v2/${OSSUTIL_VERSION}/${pkg}.zip"
          unzip -q ossutil.zip
          sudo install -m 0755 "${pkg}/ossutil" /usr/local/bin/ossutil
          rm -rf ossutil.zip "${pkg}"
          ossutil version

      - name: Upload zip files
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(plugins/*.zip)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No .zip files found under plugins/"
            exit 1
          fi

          dest="oss://${OSS_BUCKET}/${OSS_PREFIX%/}/"
          printf 'Uploading %s file(s) to %s\n' "${#files[@]}" "${dest}"
          for f in "${files[@]}"; do
            printf '  %s\n' "$f"
            ossutil cp "$f" "${dest}$(basename "$f")" --force
          done
