name: Upload plugins to Aliyun OSS

on:
  push:
    branches:
      - main
    paths:
      - 'plugins/**/*.zip'
  workflow_dispatch:

concurrency:
  group: upload-plugins-oss
  cancel-in-progress: true

env:
  OSSUTIL_VERSION: 2.1.2
  # Configurable via repository variables (Settings > Variables), so forks can
  # target their own bucket. Not secrets: masking them would make logs unreadable.
  OSS_BUCKET: ${{ vars.OSS_BUCKET || 'shumati-pro' }}
  OSS_PREFIX: ${{ vars.OSS_PREFIX || 'videoagents' }}
  # ossutil v2 reads these directly; sign version v4 requires the region.
  OSS_ENDPOINT: ${{ vars.OSS_ENDPOINT || 'oss-cn-shanghai.aliyuncs.com' }}
  OSS_REGION: ${{ vars.OSS_REGION || 'cn-shanghai' }}

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install ossutil
        run: |
          set -euo pipefail
          pkg="ossutil-${OSSUTIL_VERSION}-linux-amd64"
          curl -fsSL -o ossutil.zip \
            "https://gosspublic.alicdn.com/ossutil/v2/${OSSUTIL_VERSION}/${pkg}.zip"
          unzip -q ossutil.zip
          sudo install -m 0755 "${pkg}/ossutil" /usr/local/bin/ossutil
          rm -rf ossutil.zip "${pkg}"
          ossutil version

      - name: Upload zip files
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${OSS_ACCESS_KEY_ID}" ] || [ -z "${OSS_ACCESS_KEY_SECRET}" ]; then
            echo "::error::Missing repository secrets OSS_ACCESS_KEY_ID / OSS_ACCESS_KEY_SECRET"
            exit 1
          fi

          shopt -s nullglob
          files=(plugins/*.zip)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No .zip files found under plugins/"
            exit 1
          fi

          printf 'Target: oss://%s/%s/ (%s)\n' "${OSS_BUCKET}" "${OSS_PREFIX}" "${OSS_ENDPOINT}"
          printf 'Uploading %s file(s):\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"
          for f in "${files[@]}"; do
            ossutil cp "$f" "oss://${OSS_BUCKET}/${OSS_PREFIX}/$(basename "$f")" --force
          done

      - name: List remote directory
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: ossutil ls "oss://${OSS_BUCKET}/${OSS_PREFIX}/"
