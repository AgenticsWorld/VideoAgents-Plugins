name: Upload plugins to Aliyun OSS

on:
  push:
    branches:
      - main
    paths:
      - 'plugins/**/*.zip'
      - 'README.md'
      - 'scripts/build_readme_json.py'
      - '.github/workflows/upload-plugins-to-oss.yml'
  workflow_dispatch:

concurrency:
  group: upload-plugins-oss
  cancel-in-progress: true

env:
  OSSUTIL_VERSION: 2.1.2
  # All OSS coordinates come from repository variables
  # (Settings > Secrets and variables > Actions > Variables).
  # Deliberately no defaults: nothing about the target bucket lives in this repo.
  OSS_BUCKET: ${{ vars.OSS_BUCKET }}
  OSS_PREFIX: ${{ vars.OSS_PREFIX }}
  # ossutil v2 reads these directly; sign version v4 requires the region.
  OSS_ENDPOINT: ${{ vars.OSS_ENDPOINT }}
  OSS_REGION: ${{ vars.OSS_REGION }}
  # Public URL prefix the zip files are served from, baked into readme.json.
  PLUGIN_DOWNLOAD_BASE: ${{ vars.PLUGIN_DOWNLOAD_BASE }}

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history so the push range can be diffed.
          fetch-depth: 0

      - name: Check configuration
        run: |
          set -euo pipefail
          missing=()
          for v in OSS_BUCKET OSS_PREFIX OSS_ENDPOINT OSS_REGION PLUGIN_DOWNLOAD_BASE; do
            [ -n "${!v:-}" ] || missing+=("$v (variable)")
          done
          [ -n "${AK_ID}" ] || missing+=("OSS_ACCESS_KEY_ID (secret)")
          [ -n "${AK_SECRET}" ] || missing+=("OSS_ACCESS_KEY_SECRET (secret)")
          if [ ${#missing[@]} -gt 0 ]; then
            printf '::error::Not configured: %s\n' "$(IFS=', '; echo "${missing[*]}")"
            exit 1
          fi
        env:
          AK_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          AK_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}

      - name: Select changed zip files
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          list="${RUNNER_TEMP}/upload-list.txt"

          # Incremental only for a push whose base commit is still reachable.
          # Manual runs and force-push/initial-push fall back to uploading everything.
          incremental=false
          if [ "${EVENT_NAME}" = "push" ] \
            && [ -n "${BEFORE_SHA}" ] \
            && ! printf '%s' "${BEFORE_SHA}" | grep -qE '^0+$' \
            && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            incremental=true
          fi

          if [ "${incremental}" = true ]; then
            echo "Mode: incremental (${BEFORE_SHA}..${AFTER_SHA})"
            # :(glob) keeps * from crossing '/', matching the full-mode find below.
            git diff --name-only --diff-filter=ACMR \
              "${BEFORE_SHA}" "${AFTER_SHA}" -- ':(glob)plugins/*.zip' > "${list}"
          else
            echo "Mode: full (all zip files under plugins/)"
            find plugins -maxdepth 1 -type f -name '*.zip' | sort > "${list}"
            if [ ! -s "${list}" ]; then
              echo "::error::No .zip files found under plugins/"
              exit 1
            fi
          fi

          count=$(wc -l < "${list}" | tr -d ' ')
          echo "count=${count}" >> "${GITHUB_OUTPUT}"
          echo "list=${list}" >> "${GITHUB_OUTPUT}"
          if [ "${count}" -eq 0 ]; then
            echo "No zip changes in this push - nothing to upload."
          else
            printf 'Selected %s file(s):\n' "${count}"
            sed 's/^/  /' "${list}"
          fi

      - name: Install ossutil
        run: |
          set -euo pipefail
          pkg="ossutil-${OSSUTIL_VERSION}-linux-amd64"
          curl -fsSL -o ossutil.zip \
            "https://gosspublic.alicdn.com/ossutil/v2/${OSSUTIL_VERSION}/${pkg}.zip"
          unzip -q ossutil.zip
          sudo install -m 0755 "${pkg}/ossutil" /usr/local/bin/ossutil
          rm -rf ossutil.zip "${pkg}"
          ossutil version

      - name: Build readme.json
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          python3 scripts/build_readme_json.py \
            --readme README.md \
            --plugins-dir plugins \
            --download-base "${PLUGIN_DOWNLOAD_BASE}" \
            --out "${RUNNER_TEMP}/readme.json"

      - name: Upload zip files
        if: steps.select.outputs.count != '0'
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          UPLOAD_LIST: ${{ steps.select.outputs.list }}
        run: |
          set -euo pipefail
          dest="oss://${OSS_BUCKET}/${OSS_PREFIX%/}/"
          printf 'Uploading to %s\n' "${dest}"
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            printf '  %s\n' "$f"
            ossutil cp "$f" "${dest}$(basename "$f")" --force
          done < "${UPLOAD_LIST}"

      - name: Upload readme.json
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          set -euo pipefail
          dest="oss://${OSS_BUCKET}/${OSS_PREFIX%/}/readme.json"
          # Short cache: the page must pick up catalog edits without a CDN purge.
          ossutil cp "${RUNNER_TEMP}/readme.json" "${dest}" --force \
            --content-type 'application/json; charset=utf-8' \
            --cache-control 'public, max-age=60'
          printf 'Published %s\n' "${dest}"
